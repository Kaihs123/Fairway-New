<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef5f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fairway — Jersey Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1f19;--ink2:#41524b;--ink3:#7b8a84;--line:rgba(15,31,25,.08);
  --glass:rgba(255,255,255,.66);--glass2:rgba(255,255,255,.82);
  --green:#1d6b4a;--green2:#2f8a63;--mint:#d9efe4;--sky:#e3edf9;--lav:#ece6f7;--peach:#fbe9df;
  --gold:#b8933a;--red:#c8553d;--blue:#3d6fc8;
  --r:22px;--shadow:0 1px 0 rgba(255,255,255,.9) inset,0 10px 30px -12px rgba(20,50,40,.18);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);font-feature-settings:"tnum" 1,"cv11" 1;
  background:radial-gradient(1200px 700px at 10% -10%,#dff1e7 0%,transparent 60%),
             radial-gradient(900px 600px at 110% 10%,#e6ecfb 0%,transparent 55%),
             radial-gradient(900px 700px at 50% 120%,#efe8f8 0%,transparent 60%),#f4f7f5;
  background-attachment:fixed;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(14px + var(--safe-t)) 16px calc(96px + var(--safe-b))}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  border:1px solid rgba(255,255,255,.75);border-radius:var(--r);box-shadow:var(--shadow)}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 16px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(145deg,#fff,#dcefe5);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow)}
.brand b{font-size:15px;letter-spacing:.02em}
.brand small{display:block;font-size:11px;color:var(--ink3);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.dot.ok{background:#2fae6f;box-shadow:0 0 0 4px rgba(47,174,111,.18)}
.dot.warn{background:#e0a33a;box-shadow:0 0 0 4px rgba(224,163,58,.18)}
.dot.bad{background:var(--red)}
h1.serif{font-family:"Instrument Serif",serif;font-weight:400;font-size:38px;line-height:1.02;margin:6px 2px 4px;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:14px;margin:0 2px 18px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.card{padding:16px;margin-bottom:12px}
.course{display:block;width:100%;text-align:left;padding:16px;margin-bottom:12px;position:relative;overflow:hidden;transition:transform .15s}
.course:active{transform:scale(.985)}
.course .nm{font-family:"Instrument Serif",serif;font-size:25px;line-height:1.1}
.course .meta{display:flex;gap:14px;margin-top:10px;font-size:12.5px;color:var(--ink2)}
.course .meta b{display:block;font-size:17px;color:var(--ink);font-weight:700}
.course .art{position:absolute;right:-10px;top:-10px;opacity:.9}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;background:rgba(29,107,74,.09);color:var(--green);font-size:11px;font-weight:700;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:16px;font-weight:700;font-size:15px}
.btn.pri{background:linear-gradient(180deg,#24805a,#19603f);color:#fff;box-shadow:0 8px 20px -8px rgba(25,96,63,.6),0 1px 0 rgba(255,255,255,.25) inset}
.btn.sec{background:var(--glass2);border:1px solid rgba(15,31,25,.06)}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.seg{display:flex;padding:4px;border-radius:14px;background:rgba(15,31,25,.05);gap:4px;overflow-x:auto}
.seg button{flex:1;padding:9px 10px;border-radius:11px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
/* play */
.holebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.hnav{width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.hinfo{flex:1;text-align:center}
.hinfo .n{font-size:13px;color:var(--ink3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.hinfo .t{font-family:"Instrument Serif",serif;font-size:30px;line-height:1}
.hstats{display:flex;justify-content:center;gap:14px;font-size:12.5px;color:var(--ink2);margin-top:3px}
.hstats b{color:var(--ink)}
.dist{display:grid;grid-template-columns:1fr 1.35fr 1fr;align-items:end;text-align:center;padding:18px 10px 14px}
.dist .l{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase}
.dist .v{font-size:30px;font-weight:700;letter-spacing:-.02em}
.dist .big .v{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:.95;color:var(--green)}
.dist .u{font-size:13px;color:var(--ink3);font-weight:600;margin-left:2px}
.est{font-size:10.5px;font-weight:700;color:#a7782a;background:rgba(224,163,58,.14);padding:2px 7px;border-radius:999px;margin-top:6px;display:inline-block}
.reco{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:12px}
.reco .ic{width:40px;height:40px;border-radius:12px;background:var(--mint);display:grid;place-items:center;font-weight:800;color:var(--green);font-size:13px}
.reco b{font-size:15px}.reco small{display:block;color:var(--ink2);font-size:12.5px}
.maptag{position:absolute;left:12px;top:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.score{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.step{padding:12px;display:flex;align-items:center;justify-content:space-between}
.step .k{font-size:12px;color:var(--ink3);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.step .val{font-size:26px;font-weight:800;min-width:34px;text-align:center}
.step .pm{width:34px;height:34px;border-radius:11px;background:rgba(15,31,25,.06);font-size:20px;font-weight:600;display:grid;place-items:center}
.shots{margin:0;padding:0;list-style:none}
.shots li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.shots li:first-child{border-top:0}
.sn{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.shots .c{font-weight:700;font-size:14px}.shots .m{font-size:12px;color:var(--ink2)}
.shots .d{margin-left:auto;font-weight:800;font-size:17px;text-align:right}
.shots .d small{display:block;font-size:11px;color:var(--ink3);font-weight:600}
.x{width:28px;height:28px;border-radius:9px;color:var(--ink3);font-size:16px}
/* scorecard */
table.sc{width:100%;border-collapse:collapse;font-size:12.5px;text-align:center}
.sc th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:6px 2px}
.sc td{padding:7px 2px;border-top:1px solid var(--line)}
.sc td:first-child,.sc th:first-child{text-align:left;padding-left:4px}
.sc tr.tot td{font-weight:800;background:rgba(15,31,25,.03)}
.sc tr.cur td{background:rgba(29,107,74,.07)}
.mk{display:inline-grid;place-items:center;width:26px;height:26px;font-weight:800}
.mk.ea{border-radius:50%;box-shadow:0 0 0 2px var(--gold),0 0 0 4px #fff,0 0 0 6px var(--gold)}
.mk.bi{border-radius:50%;box-shadow:0 0 0 2px var(--red);color:var(--red)}
.mk.bo{border-radius:4px;box-shadow:0 0 0 1.5px var(--blue);color:var(--blue)}
.mk.db{border-radius:4px;box-shadow:0 0 0 1.5px var(--blue),0 0 0 3.5px #fff,0 0 0 5px var(--blue);color:var(--blue)}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.kpi{padding:14px 12px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.kpi .l{font-size:11px;color:var(--ink3);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.bar{height:8px;border-radius:99px;background:rgba(15,31,25,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3aa577,#1d6b4a)}
.clubrow{display:grid;grid-template-columns:72px 1fr 64px;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.clubrow:first-of-type{border-top:0}
.clubrow b{font-size:14px}
.clubrow .n{text-align:right;font-weight:800}
.clubrow .n small{display:block;font-size:10.5px;color:var(--ink3);font-weight:600}
input.num{width:64px;padding:8px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;text-align:right}
input[type=range]{width:100%;accent-color:var(--green)}
.empty{text-align:center;padding:28px 16px;color:var(--ink2);font-size:14px}
/* tabbar */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));width:min(528px,calc(100% - 24px));
  display:grid;grid-template-columns:repeat(4,1fr);padding:6px;z-index:20}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:16px;font-size:11px;font-weight:600;color:var(--ink3)}
.tabs button.on{color:var(--green);background:rgba(29,107,74,.08)}
.tabs svg{width:22px;height:22px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,31,25,.25);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);z-index:41;
  border-radius:26px 26px 0 0;padding:10px 18px calc(22px + var(--safe-b));transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto;background:rgba(250,252,251,.94)}
.sheet{visibility:hidden}.sheet.on{transform:translate(-50%,0);visibility:visible}
.grab{width:40px;height:5px;border-radius:9px;background:rgba(15,31,25,.15);margin:0 auto 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{padding:12px 6px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13.5px;text-align:center}
.opt small{display:block;font-weight:600;font-size:11px;color:var(--ink3);margin-top:2px}
.opt.on{background:var(--green);color:#fff;border-color:var(--green)}
.opt.on small{color:rgba(255,255,255,.75)}
.h3{font-size:13px;font-weight:700;margin:16px 0 8px;color:var(--ink2)}
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translate(-50%,-140%);z-index:60;padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:600;transition:transform .3s;background:rgba(15,31,25,.92);color:#fff}
.toast.on{transform:translate(-50%,0)}
.note{font-size:12.5px;color:var(--ink2);line-height:1.5}
a{color:var(--green)}
.hide{display:none!important}
.map{position:relative;padding:0;overflow:hidden;margin-bottom:12px;height:clamp(440px,76vh,760px)}
.sat{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;background:#2c3b33;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.layers,.layer{position:absolute;left:0;top:0;width:0;height:0}
.layers{z-index:0}
.layer{transform-origin:0 0;will-change:transform}
.layer img{position:absolute;width:256px;height:256px;max-width:none;opacity:0;transition:opacity .25s;user-select:none;-webkit-user-drag:none;pointer-events:none}
.layer img.in{opacity:1}
.ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1}
.ov .lab{fill:#fff;font-weight:700;paint-order:stroke;stroke:rgba(0,0,0,.65);stroke-width:3px;stroke-linejoin:round}
.glass-dark{background:rgba(15,31,25,.62);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18)}
.mtop,.mctl,.mbanner,.mbar,.mmsg,.attr{z-index:2}
.mtop{position:absolute;left:10px;top:10px;right:62px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.mtop .pill svg{margin:-4px 0}
.mctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
.mctl button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.mbanner{position:absolute;left:10px;right:62px;top:10px;padding:10px 12px;border-radius:16px;font-size:13px;line-height:1.3}
.mbanner b{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.8;margin-bottom:2px}
.brow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bpill{padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.2);font-size:12px;font-weight:700;color:#fff}
.bpill.pri{background:#ff7a3d}
.mbar{position:absolute;left:10px;right:10px;bottom:24px;border-radius:18px;padding:9px 12px;display:flex;gap:10px;align-items:center}
.mbar .cell{flex:1;min-width:0}
.mbar small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;font-weight:700}
.mbar b{font-size:26px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.mbar b i{font-style:normal;font-size:12px;opacity:.7;margin-left:2px;font-weight:600}
.mbar em{display:block;font-style:normal;font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt2{display:block;font-size:13px;font-weight:600;line-height:1.25}
.xb{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;flex:none}
.mmsg{position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%);padding:14px;border-radius:16px;text-align:center;font-size:13px;line-height:1.4}
.attr{position:absolute;left:8px;right:8px;bottom:6px;font-size:9.5px;color:rgba(255,255,255,.85);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.hrs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:12px;text-align:center;font-size:13px}
.hrs>div{background:rgba(255,255,255,.6);border-radius:12px;padding:7px 2px}
.hrs small{display:block;font-size:10px;color:var(--ink3);font-weight:600}
.pl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.pl span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(15,31,25,.05);color:var(--ink2)}
.pl span.k{background:var(--green);color:#fff}
html,body{overflow-x:hidden;max-width:100%}
.app>*{max-width:100%}
.hstats{flex-wrap:wrap;row-gap:2px}
.step{flex-wrap:wrap;gap:6px 4px}.step .k{flex:1 0 100%}.step .val{flex:1}
.step.row{flex-wrap:nowrap}.step.row .k{flex:1}.step.row .val{flex:0 0 auto;min-width:46px}
.seg button{padding:9px 6px}
@media(max-width:430px){.hrs{grid-template-columns:repeat(3,1fr)}.dist .big .v{font-size:54px}.dist .v{font-size:26px}.app{padding-left:12px;padding-right:12px}.hinfo .t{font-size:27px}.hstats{gap:4px 10px}}
@media(max-width:350px){.dist .big .v{font-size:46px}.btn{padding:12px 10px;font-size:14px}.grid4{grid-template-columns:repeat(3,1fr)}}
.teechip{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--ink);padding:2px 8px;border-radius:999px;background:rgba(15,31,25,.06)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(15,31,25,.35)}
/* ===== full-screen hole view (18Birdies-style) ===== */
body.fs{overflow:hidden}
body.fs #tabs{display:none}
body.fs .app{padding:0;max-width:none;min-height:0}
.pfs{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#24302a;z-index:1}
.mapfs{position:absolute;inset:0}
.mapfs .sat{border-radius:0}
.bubs{position:absolute;inset:0;pointer-events:none;z-index:2}
.hud{position:absolute;inset:0;pointer-events:none;z-index:5;color:#fff}
.hud>*{pointer-events:auto}
.dk{background:rgba(22,25,24,.84);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hbtn{position:absolute;left:10px;top:calc(var(--safe-t) + 18px);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff}
.hcard{position:absolute;left:64px;right:10px;max-width:440px;top:calc(var(--safe-t) + 10px);display:flex;border-radius:18px;overflow:hidden;background:rgba(40,44,43,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.hcard small{display:block;font-size:clamp(9.5px,2.9vw,12px);color:rgba(255,255,255,.72);font-weight:500;white-space:nowrap}
.hcard b{font-weight:600;letter-spacing:-.02em}
.hn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 10px 4px 12px;background:rgba(14,16,15,.92);color:#fff}
.hn b{font-size:clamp(28px,9vw,38px);line-height:1}
.hn i{font-style:normal;font-size:10px;margin-top:2px}
.hm{padding:8px 10px 8px 4px;background:rgba(14,16,15,.92);border-radius:0 16px 16px 0}
.hm b{font-size:clamp(20px,6.6vw,28px);line-height:1.15;white-space:nowrap}
.hm b i{font-style:normal;font-size:.5em;margin-left:1px;font-weight:600}
.hr{flex:1;display:flex;justify-content:space-around;align-items:center;padding:6px 6px;gap:4px;min-width:0}
.hr>*{text-align:center;color:#fff;min-width:0}
.hr b{font-size:clamp(18px,5.6vw,24px);line-height:1.15}
.tdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:1px;border:1px solid rgba(255,255,255,.5)}
.chip2{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 90px);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;max-width:94%}
.chip2.dim{color:rgba(255,255,255,.85);pointer-events:none}
.chip2 u{color:#ffb38a}
.rstack{position:absolute;right:10px;bottom:calc(var(--safe-b) + 10px);display:flex;flex-direction:column;gap:8px;width:64px}
.wbox{border-radius:16px;padding:7px 2px 6px;text-align:center;display:flex;flex-direction:column;align-items:center}
.wbox small{font-size:12px;font-weight:600}
.wbox b{font-size:17px;font-weight:700}.wbox b i{font-style:normal;font-size:11px;font-weight:600}
.rgrp{border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.rgrp button{height:52px;display:grid;place-items:center;color:#fff}
.rgrp button+button{border-top:1px solid rgba(255,255,255,.12)}
.sq{width:64px;height:64px;border-radius:16px;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#fff}
.sq.lft{position:absolute;left:10px;bottom:calc(var(--safe-b) + 10px)}
.bl{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#1f86ff}
.track{position:absolute;left:84px;right:84px;bottom:calc(var(--safe-b) + 82px);height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;color:#3ea0ff;font-size:clamp(15px,4.6vw,19px);font-weight:700}
.hnav2{position:absolute;left:84px;right:84px;bottom:calc(var(--safe-b) + 10px);height:64px;border-radius:16px;display:flex;align-items:stretch;overflow:hidden}
.hnav2 .nv{width:40px;display:grid;place-items:center;color:#fff;flex:none}
.hnav2 .nv:disabled{opacity:.3}

0,178],[4,6,422]]},{"n":"Yellow","r":65.6,"s":107,"h":[[4,3,445],[5,13,463],[3,7,196],[4,15,278],[3,17,134],[3,11,162],[4,1,337],[3,9,178],[4,5,392],[4,4,445],[5,14,463],[3,8,196],[4,16,278],[3,18,134],[3,12,162],[4,2,337],[3,10,178],[4,6,392]]},{"n":"Red","r":65.6,"s":107,"h":[[4,3,445],[5,13,463],[3,7,196],[4,15,278],[3,17,134],[3,11,162],[4,1,320],[3,9,178],[4,5,392],[4,4,445],[5,14,463],[3,8,196],[4,16,278],[3,18,134],[3,12,162],[4,2,320],[3,10,178],[4,6,392]]}]}];

 'les-mielles-golf-country-club':['#fbe5d6','#f3c3a3'],'les-ormes':['#e8e0f6','#c6b5ea'],'st-clement-s-golf-course':['#e0f1f0','#a6d8d4']};

/* ---------- storage ---------- */
const KEY='fairway.jersey.v1';

function load(){
  let d=null; try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  d=d||{};

  return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- geo ---------- */
const R_E=6371008.8, Y=1.0936133;
const rad=x=>x*Math.PI/180;
function meters(a,b){const dLa=rad(b[0]-a[0]),dLo=rad(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLo/2)**2;return 2*R_E*Math.asin(Math.sqrt(h))}
const yds=(a,b)=>meters(a,b)*Y;
function fmt(y){if(y==null||isNaN(y))return '—';return Math.max(0,Math.round(S.set.units==='m'?y/Y:y))}
const U=()=>S.set.units==='m'?'m':'y';

let GPS={pos:null,acc:null,state:'idle',err:'',sim:false,simY:0};
let watchId=null;
function startGPS(){
  if(watchId!==null||GPS.sim) return;
  if(!('geolocation' in navigator)){GPS.state='bad';GPS.err='No GPS on this device';render();return}
  GPS.state='wait';render();
  try{
    watchId=navigator.geolocation.watchPosition(p=>{
      GPS.pos=[p.coords.latitude,p.coords.longitude];GPS.acc=p.coords.accuracy;GPS.state=p.coords.accuracy<=25?'ok':'warn';GPS.err='';
      autoAdvance();renderLive();
    },e=>{GPS.state='bad';GPS.err=e.code===1?'Location blocked':'No GPS fix';watchId=null;render()},
    {enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  }catch(e){GPS.state='bad';GPS.err='Location blocked';render()}
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
const course=id=>COURSES.find(c=>c.id===id);
function teeOf(c,idx){return c.tees[idx]||c.tees[0]}
function defaultTee(c){const i=S.set.tee[c.id];if(i!=null)return i;const y=c.tees.findIndex(t=>/yellow/i.test(t.n));return y>=0?y:0}
const parTot=t=>t.h.reduce((a,h)=>a+h[0],0), ydsTot=t=>t.h.reduce((a,h)=>a+h[2],0);
function courseHcp(t){const par=parTot(t);if(!t.s||!t.r)return Math.round(S.set.hcp*(t.h.length===9?.5:1));
  let ch=S.set.hcp*t.s/113+(t.r-par);return Math.round(t.h.length===9?ch/2:ch)}
function strokesRec(si,ch,n){if(!si)si=0;let s=Math.floor(ch/n);if(si&&si<=ch%n)s++;if(ch<0&&si>n+ch)s--;return s}
function stableford(gross,par,rec){if(!gross)return 0;return Math.max(0,2+par+rec-gross)}

/* ---------- round model ---------- */
function newRound(cid,teeIdx){
  const c=course(cid),t=teeOf(c,teeIdx);
  S.set.tee[cid]=teeIdx;
  S.active={id:Date.now(),cid,tee:teeIdx,date:new Date().toISOString(),cur:0,
    holes:t.h.map(()=>({g:0,p:0,pen:0,fir:null,shots:[],man:false}))};
  save();
}
function R(){return S.active}
function ctx(){const r=R();if(!r)return null;const c=course(r.cid),t=teeOf(c,r.tee),i=r.cur,h=t.h[i],H=r.holes[i];
  return {r,c,t,i,par:h[0],si:h[1],len:h[2],H}}
function gk(c,i){return c.id+'#'+(i+1)}

/* distances from you (ball / GPS / tee) to the green; returns {f,c,b,est,src} in yards */
function distances(){
  const x=ctx();if(!x)return null;const hm=holeModel(x),pp=player(x,hm);
  if(pp&&hm.green){const c=yds(pp.p,hm.green),fb=greenFB(hm,pp.p);return{f:fb?fb.f:c-11,c,b:fb?fb.b:c+11,est:!hm.poly,src:pp.src}}
  return{f:x.len-11,c:x.len,b:x.len+11,est:true,src:'card'}
}
function along(){ // yards travelled from tee (for map)
  const x=ctx(),d=distances();if(!x||!d)return 0;
  if(d.src==='card')return 0;return Math.max(0,Math.min(x.len+20,x.len-d.c))
}
function recommend(y){
  const clubs=S.bag.filter(b=>b.y>0).sort((a,b)=>a.y-b.y);if(!clubs.length||y<=0)return null;
  let pick=clubs.find(b=>b.y>=y-4);if(!pick)pick=clubs[clubs.length-1];
  const learned=clubAvg()[pick.c];return{club:pick.c,carry:learned?learned.avg:pick.y,learned:!!learned}
}
function shotDist(H,k){ // yards for shot k on hole
  const s=H.shots[k],n=H.shots[k+1];if(!s)return null;
  if(n){if(s.pos&&n.pos)return yds(s.pos,n.pos);if(s.rem!=null&&n.rem!=null)return Math.abs(s.rem-n.rem)}
  if(s.end!=null)return s.end;return null
}
let lastAuto=0;
function autoAdvance(){const x=ctx();if(!x||GPS.sim||!GPS.pos)return;const n=x.i+1;if(n>=x.t.h.length)return;
  const nt=holeModel({c:x.c,t:x.t,i:n,H:null}).teeSel;if(!nt)return;
  const played=x.H.g||autoGross(x.H)||x.H.shots.length;
  if(played&&yds(GPS.pos,nt)<35&&Date.now()-lastAuto>60e3){lastAuto=Date.now();x.r.cur=n;save();render();toast('On the '+(n+1)+ord(n+1)+' tee — switched hole');onHole()}}
const ord=n=>(n%10===1&&n!==11)?'st':(n%10===2&&n!==12)?'nd':(n%10===3&&n!==13)?'rd':'th';
function onHole(){const x=ctx();if(!x)return;Promise.all([loadGeo(x.c),loadWx(x.c)]).then(()=>{render();refreshElev()})}

/* ================= LIVE DATA: course geometry (OSM), satellite, elevation, weather ================= */
const NET={osm:{},wx:{},elev:{},err:{}};
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
const TILE=(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
async function overpass(q){
  let last;for(const u of OVERPASS){try{const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});
    if(r.ok)return await r.json();last=r.status}catch(e){last=e}}throw last||'overpass'}
function norm(s){return (s||'').toLowerCase().replace(/golf|club|course|&|country|the|'s|\(.*?\)/g,'').replace(/[^a-z]/g,'')}

/* Fetch hole lines + green polygons for one course, cache 30 days */
async function loadGeo(c){
  if(NET.osm[c.id]&&NET.osm[c.id]!=='loading')return NET.osm[c.id];
  const ck='fw.geo.'+c.id,cached=lsGet(ck);
  if(cached&&Date.now()-cached.at<30*864e5){NET.osm[c.id]=cached;return cached}
  if(NET.osm[c.id]==='loading')return null;NET.osm[c.id]='loading';
  try{
    // 1. find the course boundary that best matches this course
    const q1=`[out:json][timeout:25];(way["leisure"="golf_course"](around:1500,${c.lat},${c.lng});relation["leisure"="golf_course"](around:1500,${c.lat},${c.lng}););out tags center;`;
    const a=await overpass(q1);const want=norm(c.name);
    let best=null,bs=-1e9;(a.elements||[]).forEach(e=>{const n=norm(e.tags&&e.tags.name);const ce=e.center||{lat:c.lat,lon:c.lng};
      let sc=-meters([c.lat,c.lng],[ce.lat,ce.lon])/100;if(n&&(n.includes(want)||want.includes(n)))sc+=50;if(sc>bs){bs=sc;best=e}});
    let area=best?(best.type==='way'?2400000000+best.id:3600000000+best.id):null;
    const sel=area?`(area:${area})`:`(around:900,${c.lat},${c.lng})`;
    const q2=`[out:json][timeout:25];(way["golf"="hole"]${sel};way["golf"="green"]${sel};way["golf"="tee"]${sel};way["golf"="bunker"]${sel};way["natural"="sand"]${sel};way["golf"="water_hazard"]${sel};way["natural"="water"]${sel};way["golf"="fairway"]${sel};);out geom;`;
    const d=await overpass(q2);
    const holes={},greens=[],bunkers=[],water=[];
    (d.elements||[]).forEach(e=>{const g=(e.geometry||[]).map(p=>[p.lat,p.lon]);if(!g.length)return;const t=e.tags||{};
      if(t.golf==='hole'){const n=parseInt(t.ref);if(!n)return;holes[n]={line:g,tee:g[0],end:g[g.length-1],par:parseInt(t.par)||null}}
      else if(t.golf==='green')greens.push(g);
      else if(t.golf==='bunker'||t.natural==='sand')bunkers.push(g);
      else if(t.golf==='water_hazard'||t.natural==='water')water.push(g)});
    // attach green polygon to each hole (polygon containing / nearest to line end)
    Object.values(holes).forEach(h=>{let bg=null,bd=1e9;greens.forEach(p=>{const cc=centroid(p);const dd=inPoly(h.end,p)?0:meters(h.end,cc);if(dd<bd){bd=dd;bg=p}});
      if(bg&&bd<60){h.poly=bg;h.green=centroid(bg)}else h.green=h.end});
    const out={at:Date.now(),holes,bunkers,water,n:Object.keys(holes).length};
    NET.osm[c.id]=out;lsSet(ck,out);return out;
  }catch(e){NET.osm[c.id]={at:Date.now(),holes:{},n:0,fail:true};NET.err.osm=String(e);return NET.osm[c.id]}
}
function centroid(p){let x=0,y=0;p.forEach(q=>{x+=q[0];y+=q[1]});return[x/p.length,y/p.length]}
function inPoly(pt,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];
  if(((a[1]>pt[1])!==(b[1]>pt[1]))&&(pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0]))ins=!ins}return ins}
/* local flat projection in metres around origin */
function enu(o,p){const k=111320;return[(p[1]-o[1])*k*Math.cos(rad(o[0])),(p[0]-o[0])*k]}
function bearing(a,b){const y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0])),x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));return(Math.atan2(y,x)*180/Math.PI+360)%360}
/* front/back of green along line from player through centre */
function frontBack(pos,cen,poly){
  const d=enu(pos,cen),L=Math.hypot(d[0],d[1]);if(L<1)return null;const u=[d[0]/L,d[1]/L];const ts=[];
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=enu(pos,poly[j]),b=enu(pos,poly[i]);const e=[b[0]-a[0],b[1]-a[1]];
    const den=u[0]*e[1]-u[1]*e[0];if(Math.abs(den)<1e-9)continue;const t=(a[0]*e[1]-a[1]*e[0])/den,s=(a[0]*u[1]-a[1]*u[0])/den;if(s>=0&&s<=1&&t>0)ts.push(t)}
  if(ts.length<2)return null;return{f:Math.min(...ts)*Y,b:Math.max(...ts)*Y}}
function holeGeo(x){const g=NET.osm[x.c.id];return g&&g.holes?g.holes[x.i+1]||null:null}

/* ---------- elevation (Copernicus 90 m DEM via Open-Meteo) ---------- */
const ek=p=>p[0].toFixed(4)+','+p[1].toFixed(4);
async function elev(points){
  const need=points.filter(p=>p&&NET.elev[ek(p)]==null);
  if(need.length&&NET.elevFail&&Date.now()-NET.elevFail<60e3)return null;
  if(need.length){try{const r=await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${need.map(p=>p[0].toFixed(5)).join(',')}&longitude=${need.map(p=>p[1].toFixed(5)).join(',')}`);
    const j=await r.json();(j.elevation||[]).forEach((v,i)=>NET.elev[ek(need[i])]=v)}catch(e){NET.err.elev=String(e);NET.elevFail=Date.now();return null}}
  return points.map(p=>p?NET.elev[ek(p)]:null)}
async function refreshElev(){
  const x=ctx();if(!x)return;const hm=holeModel(x);if(!hm.green)return;const pp=player(x,hm);
  const pts=[hm.green,pp&&pp.p,pp&&target(x,hm,pp)].filter(Boolean);
  if(!pts.some(p=>NET.elev[ek(p)]==null))return;
  await elev(pts);if(VIEW==='play')schedule()}

/* ---------- weather (Open-Meteo) ---------- */
async function loadWx(c){
  const w=NET.wx[c.id];if(w&&w!=='loading'&&Date.now()-w.at<10*60e3)return w;if(w==='loading')return null;NET.wx[c.id]='loading';
  try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lng}&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,relative_humidity_2m&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=mph&timezone=Europe%2FLondon&forecast_days=2`;
    const j=await (await fetch(u)).json();if(!j.current)throw 'wx';NET.wx[c.id]={at:Date.now(),cur:j.current,hr:j.hourly};}
  catch(e){NET.wx[c.id]={at:Date.now(),fail:true};NET.err.wx=String(e)}
  render();return NET.wx[c.id]}
const WXC={0:['Clear','☀️'],1:['Mostly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],45:['Fog','🌫️'],48:['Fog','🌫️'],51:['Drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Drizzle','🌧️'],61:['Light rain','🌦️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],71:['Snow','🌨️'],73:['Snow','🌨️'],75:['Snow','🌨️'],80:['Showers','🌦️'],81:['Showers','🌧️'],82:['Heavy showers','⛈️'],95:['Thunder','⛈️'],96:['Thunder','⛈️'],99:['Thunder','⛈️']};
const wxc=c=>WXC[c]||['—','🌡️'];
const compass=d=>['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(d/22.5)%16];
function wxCard(c,compact){
  const w=NET.wx[c.id];
  if(!w||w==='loading')return `<div class="card glass wx"><div class="note">Loading live weather for ${c.town}…</div></div>`;
  if(w.fail)return `<div class="card glass wx"><div class="note">Live weather needs an internet connection${inFrame()?' — it is blocked inside Claude\'s preview; open the app on your phone':''}.</div></div>`;
  const k=w.cur,[lab,ic]=wxc(k.weather_code);const now=new Date();const hrs=[];
  w.hr.time.forEach((t,i)=>{const d=new Date(t);if(d>=new Date(now.getTime()-36e5)&&hrs.length<6)hrs.push(i)});
  return `<div class="card glass wx"><div class="row"><div style="font-size:34px;line-height:1">${ic}</div><div style="flex:1;min-width:0"><div class="eyebrow">Live · ${c.town}</div><b style="font-size:22px">${Math.round(k.temperature_2m)}°C</b><div class="note">${lab} · feels ${Math.round(k.apparent_temperature)}°</div></div>
   <div style="text-align:center;width:92px;flex:none">${windArrow(k.wind_direction_10m,0,34)}<div style="font-weight:800;font-size:15px">${Math.round(k.wind_speed_10m)}<span class="note"> mph</span></div><div class="note">${compass(k.wind_direction_10m)} · gust ${Math.round(k.wind_gusts_10m)}</div></div></div>
   ${compact?'':`<div class="hrs">${hrs.map(i=>`<div><small>${w.hr.time[i].slice(11,16)}</small><div>${wxc(w.hr.weather_code[i])[1]}</div><b>${Math.round(w.hr.temperature_2m[i])}°</b><small>${Math.round(w.hr.wind_speed_10m[i])}mph ${compass(w.hr.wind_direction_10m[i])}</small><small>${w.hr.precipitation_probability[i]??0}% rain</small></div>`).join('')}</div>`}</div>`}
/* arrow showing where the wind blows TO, rotated relative to a view bearing */
function windArrow(from,viewBrg,s){const rot=(from+180-viewBrg+360)%360;
  return `<svg width="${s}" height="${s}" viewBox="0 0 40 40" style="transform:rotate(${rot}deg)"><circle cx="20" cy="20" r="18" fill="rgba(61,111,200,.1)"/><path d="M20 6l7 12h-4.5v15h-5V18H13z" fill="#3d6fc8"/></svg>`}
function windNow(c){const w=NET.wx[c.id];return w&&w.cur?{v:w.cur.wind_speed_10m,g:w.cur.wind_gusts_10m,from:w.cur.wind_direction_10m}:null}

/* ---------- plays-like ---------- */
function playsLike(x,d){
  const out={adj:0,elev:null,head:0,cross:0,parts:[]};const gc=greenCentre(x);if(!gc)return out;
  const from=curPos()||holeTee(x);if(!from)return out;
  const e=[NET.elev[ek(from)],NET.elev[ek(gc)]];
  if(e[0]!=null&&e[1]!=null){out.elev=(e[1]-e[0])*Y;out.adj+=out.elev;}
  const w=windNow(x.c);if(w&&d.c>40){const brg=bearing(from,gc);const dl=rad(w.from-brg);
    out.head=w.v*Math.cos(dl);out.cross=w.v*Math.sin(dl);
    const pct=out.head>0?out.head*0.01:out.head*0.005;out.wind=d.c*pct;out.adj+=out.wind}
  return out}

const PRESETS={'les-ormes':[{id:'a',holes:[1,2,3,4,5,6,7,8,9],ppy:5.75,
 anchor:[{hole:1,what:'the middle of the 1st green',px:[894,248]},{hole:2,what:'the middle of the 2nd green',px:[210,1880]}],
 tees:{"1":{"yellow":[708,2189],"white":[718,2310],"red":[641,1988]},"2":{"yellow":[594,121],"white":[581,67],"red":[488,360]},"3":{"yellow":[-275,1792],"white":[-246,1472],"red":[-282,1867]},"4":{"yellow":[-231,3708],"white":[-156,3761],"red":[-353,3622]},"5":{"yellow":[-994,2923],"white":[-1002,2998],"red":[-987,2855]},"6":{"yellow":[-956,614],"white":[-940,535],"red":[-991,789]},"7":{"yellow":[-1552,2062],"white":[-1590,1984],"red":[-1515,2139]},"8":{"yellow":[-732,2944],"white":[-738,3013],"red":[-712,2738]},"9":{"yellow":[-388,899],"white":[-421,813],"red":[-263,1233]}},
 greens:{"1":{"c":[894,248],"h":11,"r":63},"2":{"c":[210,1880],"h":11,"r":63},"3":{"c":[-378,2929],"h":10.2,"r":59},"4":{"c":[-1053,3125],"h":11.1,"r":64},"5":{"c":[-754,637],"h":11,"r":63},"6":{"c":[-1264,2148],"h":11,"r":63},"7":{"c":[-1196,2803],"h":11.0,"r":63},"8":{"c":[-544,918],"h":11,"r":63},"9":{"c":[-44,1817],"h":11.7,"r":68}},
 bunkers:[[925,338,26],[964,335,20],[626,790,22],[283,1285,36],[388,1470,26],[185,1772,24],[292,1876,30]]}]};
const PCACHE={};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const TEEK=n=>(n||'').toLowerCase().split(/[\s(\/\-]/)[0];
const TEE_COL={white:'#ffffff',yellow:'#ffd23f',red:'#ff5a4d',blue:'#4d8dff',black:'#2b2b2b',gold:'#e8b93a',green:'#35c46b',orange:'#ff9a3d',ladies:'#ff8fb8',purple:'#a77be0'};
function presetOf(cid,hole){const L=PRESETS[cid];return L?(L.find(p=>p.holes.includes(hole))||null):null}
function presetFor(cid){const L=PRESETS[cid];return L?L[0]:null}
function isAligned(cid){const p=presetFor(cid);return !p||!!S.align[cid+':'+p.id]}
function presetFeat(cid,p){
  const al=S.align[cid+':'+p.id];if(!al)return null;
  const key=cid+':'+p.id+':'+al.at;if(PCACHE[key])return PCACHE[key];
  const o=al.o,ref=p.anchor[0].px,L=al.l,cl=Math.cos(rad(o[0]));
  const ll=px=>{const zr=px[0]-ref[0],zi=-(px[1]-ref[1]);const e=L[0]*zr-L[1]*zi,n=L[0]*zi+L[1]*zr;return[o[0]+n/111320,o[1]+e/(111320*cl)]};
  const mpp=Math.hypot(L[0],L[1]);
  const out={tees:{},greens:{},bunkers:p.bunkers.map(b=>({p:ll(b),r:b[2]*mpp}))};
  for(const h in p.tees){out.tees[h]={};for(const k in p.tees[h])out.tees[h][k]=ll(p.tees[h][k])}
  for(const h in p.greens){const g=p.greens[h];out.greens[h]={c:ll(g.c),r:g.r*mpp,h:g.h}}
  PCACHE[key]=out;return out}
/* two taps -> similarity transform photo pixels -> lat/lng */
function computeAlign(p,t1,t2){
  const a=p.anchor,dz=[a[1].px[0]-a[0].px[0],-(a[1].px[1]-a[0].px[1])];
  const e=(t2[1]-t1[1])*111320*Math.cos(rad(t1[0])),n=(t2[0]-t1[0])*111320,dd=dz[0]*dz[0]+dz[1]*dz[1];
  let re=(e*dz[0]+n*dz[1])/dd,im=(n*dz[0]-e*dz[1])/dd;
  const exp=0.9144/p.ppy,m=Math.hypot(re,im);let adj=false;
  if(m<exp*.9||m>exp*1.1){re*=exp/m;im*=exp/m;adj=true}
  return{o:t1,l:[re,im],at:Date.now(),adj}}
function allPresetBunkers(cid){const L=PRESETS[cid];let out=[];if(L)L.forEach(p=>{const f=presetFeat(cid,p);if(f)out=out.concat(f.bunkers)});return out}

/* everything we know about a hole, best source first */
function holeModel(x,full){
  const cid=x.c.id,n=x.i+1,k=gk(x.c,x.i),tk=TEEK(x.t.n);
  const m={tees:{},teeSel:null,green:null,gr:11,gh:11,poly:null,line:null,src:'',bunkers:[],water:[],tk,mapped:false};
  const g=holeGeo(x),us=S.greens[k],ut=S.tb[k]||{};
  const pr=presetOf(cid,n),pf=pr?presetFeat(cid,pr):null;
  if(g){m.line=g.line;m.poly=g.poly||null;m.green=g.green;if(g.tee)m.tees[tk]=g.tee;m.src='map'}
  if(pf&&pf.greens[n]){if(!m.green){m.green=pf.greens[n].c;m.gr=pf.greens[n].r;m.gh=pf.greens[n].h||11;m.src='photo'}
    const pt=pf.tees[n]||{};for(const q in pt)if(!m.tees[q])m.tees[q]=pt[q];
    const uk=Object.keys(ut).find(q=>pt[q]);if(uk){const dl=ut[uk][0]-pt[uk][0],dg=ut[uk][1]-pt[uk][1];for(const q in pt)if(!ut[q])m.tees[q]=[pt[q][0]+dl,pt[q][1]+dg]}}
  if(us&&us.c){m.green=us.c;m.src=m.src||'mine'}
  Object.assign(m.tees,ut);
  if(!m.tees[tk]&&S.teesPos[k])m.tees[tk]=S.teesPos[k];
  const kk=m.tees[tk]?tk:m.tees.yellow?'yellow':m.tees.white?'white':Object.keys(m.tees)[0];
  if(kk){m.tk=kk;m.teeSel=m.tees[kk]}
  m.mapped=!!(m.green&&m.teeSel);
  if(full){const og=NET.osm[cid];
    if(og&&og.bunkers)og.bunkers.forEach(p=>m.bunkers.push({poly:p}));
    if(og&&og.water)og.water.forEach(p=>m.water.push({poly:p}));
    allPresetBunkers(cid).forEach(b=>m.bunkers.push(b))}
  return m}
function holeTee(x){const m=holeModel(x);return m.teeSel||(x.H&&x.H.shots[0]&&x.H.shots[0].pos)||null}
function greenCentre(x){return holeModel(x).green}

/* ---------- where "you" are: dragged test position > live GPS on the course > the tee box ---------- */
const PL={spoof:{},tgt:{}};
function lerpLL(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
function gpsOnCourse(hm){return !!(GPS.pos&&hm&&hm.green&&meters(GPS.pos,hm.green)<1500)}
function player(x,hm){
  x=x||ctx();if(!x)return null;hm=hm||holeModel(x);const k=gk(x.c,x.i);
  if(PL.spoof[k])return{p:PL.spoof[k],src:'test'};
  if(gpsOnCourse(hm))return{p:GPS.pos,src:'gps'};
  if(hm.teeSel)return{p:hm.teeSel,src:'tee'};
  return null}
function curPos(){const p=player();return p?p.p:null}
const driverY=()=>{const d=S.bag.find(b=>b.c==='Driver');return d&&d.y?d.y:230};
/* the aiming target: undefined = automatic, null = the green itself, [lat,lng] = where you put it */
function target(x,hm,pp){
  x=x||ctx();hm=hm||holeModel(x);pp=pp||player(x,hm);if(!pp||!hm.green)return null;
  const k=gk(x.c,x.i),t=PL.tgt[k];if(t===null)return null;if(t)return t;
  const d=yds(pp.p,hm.green);if(d<215)return null;
  return lerpLL(pp.p,hm.green,Math.min(driverY(),d-70)/d)}
/* front / back of the green along your line of play */
function greenFB(hm,from){
  if(!hm.green||!from)return null;
  if(hm.poly){const fb=frontBack(from,hm.green,hm.poly);if(fb){const c=yds(from,hm.green);return{f:fb.f,b:fb.b,fp:lerpLL(from,hm.green,fb.f/c),bp:lerpLL(from,hm.green,fb.b/c)}}}
  const c=yds(from,hm.green);if(c<1)return null;const h=hm.gh||11;
  return{f:Math.max(0,c-h),b:c+h,fp:lerpLL(from,hm.green,(c-h)/c),bp:lerpLL(from,hm.green,(c+h)/c)}}
/* elevation + wind adjustment for one leg */
function legPlays(x,from,to,dist){
  const out={adj:0,elev:null,head:0,cross:0,wind:null};if(!from||!to)return out;
  const e=[NET.elev[ek(from)],NET.elev[ek(to)]];
  if(e[0]!=null&&e[1]!=null){out.elev=(e[1]-e[0])*Y;out.adj+=out.elev}
  const w=windNow(x.c);if(w&&dist>40){const dl=rad(w.from-bearing(from,to));out.head=w.v*Math.cos(dl);out.cross=w.v*Math.sin(dl);
    out.wind=dist*(out.head>0?out.head*0.01:out.head*0.005);out.adj+=out.wind}
  return out}

/* ================= MAP ENGINE: full-screen satellite, drag you / drag the target, fly between holes ================= */
const SRCS={
 esri:{n:'Standard',u:(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`,a:'Imagery © Esri, Maxar, Earthstar Geographics'},
 clarity:{n:'Clarity',u:(z,x,y)=>`https://clarity.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`,a:'Imagery © Esri (Clarity), Maxar'}};
const MAP={dom:null,layersEl:null,svg:null,bub:null,W:390,H:800,view:null,key:'',sig:'',touched:false,mode:null,layers:{},zc:1,ok:0,err:0,raf:0,ptrs:new Map(),pinch:null,drag:null,anim:0,animId:0,zoomG:false,fitPos:null};
function inFrame(){try{return window.self!==window.top}catch(e){return true}}
function wpx(p,z){const s=256*2**z,si=Math.sin(rad(p[0]));return[(p[1]+180)/360*s,(0.5-Math.log((1+si)/(1-si))/(4*Math.PI))*s]}
function unwpx(px,z){const s=256*2**z;const lng=px[0]/s*360-180;const n=Math.PI-2*Math.PI*px[1]/s;return[180/Math.PI*Math.atan(.5*(Math.exp(n)-Math.exp(-n))),lng]}
const MINZ=14.5,MAXZ=21.5;
function holeKeyNow(){const x=ctx();return x?x.c.id+'#'+(x.i+1):''}
function tz(){const bump=Math.min(1,Math.log2(window.devicePixelRatio||1));const zi=clamp(Math.round(MAP.view.z+bump),3,19);return{zi,s:2**(MAP.view.z-zi)}}
function mpp(){return 156543.03392*Math.cos(rad(MAP.view.c[0]))/2**MAP.view.z}
function toScreen(ll){const v=MAP.view,t=tz(),C=wpx(v.c,t.zi),q=wpx(ll,t.zi),th=rad(-v.rot),cs=Math.cos(th),sn=Math.sin(th);
  const dx=(q[0]-C[0])*t.s,dy=(q[1]-C[1])*t.s;return[MAP.W/2+dx*cs-dy*sn,MAP.H/2+dx*sn+dy*cs]}
function fromScreen(sx,sy){const v=MAP.view,t=tz(),C=wpx(v.c,t.zi),th=rad(v.rot),cs=Math.cos(th),sn=Math.sin(th);
  const dx=sx-MAP.W/2,dy=sy-MAP.H/2;return unwpx([C[0]+(dx*cs-dy*sn)/t.s,C[1]+(dx*sn+dy*cs)/t.s],t.zi)}
function panBy(dx,dy){const v=MAP.view,t=tz(),C=wpx(v.c,t.zi),th=rad(v.rot),cs=Math.cos(th),sn=Math.sin(th),ux=-dx,uy=-dy;
  v.c=unwpx([C[0]+(ux*cs-uy*sn)/t.s,C[1]+(ux*sn+uy*cs)/t.s],t.zi);schedule()}
function zoomAt(dz,sx,sy){const a=fromScreen(sx,sy);MAP.view.z=clamp(MAP.view.z+dz,MINZ,MAXZ);const c=toScreen(a);panBy(sx-c[0],sy-c[1]);MAP.touched=true}
function schedule(){if(MAP.raf)return;MAP.raf=requestAnimationFrame(()=>{MAP.raf=0;mapRender();mapDraw();hudLive()})}

function mapBuild(){
  const d=document.createElement('div');d.className='sat';
  d.innerHTML=`<div class="layers"></div><svg class="ov" xmlns="http://www.w3.org/2000/svg"></svg><div class="bubs"></div><div class="mmsg dk hide"></div><div class="attr"></div>`;
  MAP.dom=d;MAP.layersEl=d.querySelector('.layers');MAP.svg=d.querySelector('.ov');MAP.bub=d.querySelector('.bubs');
  d.addEventListener('contextmenu',e=>e.preventDefault());
  const P=MAP.ptrs,loc=e=>{const r=d.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  d.addEventListener('pointerdown',e=>{
    if(e.target.closest('button,.bp,.mmsg'))return;
    MAP.anim=0;try{d.setPointerCapture(e.pointerId)}catch(_){}
    const[lx,ly]=loc(e);
    if(P.size===0&&!MAP.mode&&MAP.view){const h=hitTest(lx,ly);if(h)MAP.drag=h}
    P.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now(),moved:false});
    if(P.size===2){MAP.drag=null;P.forEach(p=>p.moved=true);pinchStart()}
    e.preventDefault()});
  d.addEventListener('pointermove',e=>{
    const p=P.get(e.pointerId);if(!p)return;
    if(P.size===1){
      if(!p.moved&&Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>6)p.moved=true;
      if(p.moved){
        if(MAP.drag){const[lx,ly]=loc(e);dragTo(lx-MAP.drag.ox,ly-MAP.drag.oy)}
        else{panBy(e.clientX-p.x,e.clientY-p.y);MAP.touched=true}}
      p.x=e.clientX;p.y=e.clientY}
    else{p.x=e.clientX;p.y=e.clientY;pinchMove()}});
  const up=e=>{const p=P.get(e.pointerId);if(!p)return;P.delete(e.pointerId);
    if(MAP.drag){const dr=MAP.drag;MAP.drag=null;if(p.moved){dragEnd(dr);return}}
    if(P.size===0&&!p.moved&&performance.now()-p.t<700){const[lx,ly]=loc(e);mapTap(lx,ly)}
    if(P.size<2)MAP.pinch=null;
    if(P.size===1)P.forEach(q=>q.moved=true)};
  d.addEventListener('pointerup',up);
  d.addEventListener('pointercancel',e=>{P.delete(e.pointerId);MAP.pinch=null;MAP.drag=null});
  d.addEventListener('wheel',e=>{e.preventDefault();MAP.anim=0;const r=d.getBoundingClientRect();zoomAt(-e.deltaY*0.002,e.clientX-r.left,e.clientY-r.top)},{passive:false});
}
function pinchPts(){return[...MAP.ptrs.values()].slice(0,2)}
function pinchStart(){const[a,b]=pinchPts(),r=MAP.dom.getBoundingClientRect();

/* ---------- framing: you at the bottom, the green at the top, hole pointing up ---------- */
function insets(){
  const r=MAP.dom?MAP.dom.getBoundingClientRect():{top:0,bottom:MAP.H};
  const hc=document.querySelector('.chip2')||document.querySelector('.hcard,.mbanner2'),tr=document.querySelector('.track');
  const top=hc?hc.getBoundingClientRect().bottom-r.top+14:110,bot=tr?r.bottom-tr.getBoundingClientRect().top+16:200;
  return{top:clamp(top,60,MAP.H*.4),bot:clamp(bot,90,MAP.H*.45)}}
function frameView(x,hm,pp){
  const W=MAP.W,H=MAP.H,{top,bot}=insets(),a=pp.p,g=hm.green,k0=156543.034*Math.cos(rad(g[0]));
  const rot=meters(a,g)>3?bearing(a,g):(MAP.view?MAP.view.rot:0),gr=Math.max(hm.gr||10,8);
  if(MAP.zoomG){const span=gr*2+46,ppm=(H-top-bot)/span,z=clamp(Math.log2(k0*ppm),16,20.8),p2=2**z/k0;
    const yG=(top+(H-bot))/2,s=(H/2-yG)/p2,L=Math.max(meters(a,g),1);return{c:lerpLL(g,a,s/L),z,rot}}
  const Lm=Math.max(meters(a,g),20),avail=H-top-bot-34;
  const z=clamp(Math.log2(k0*avail/(Lm+gr+16)),15.5,19.6),p2=2**z/k0;
  let yG=top+(gr+8)*p2;const yP=yG+Lm*p2;yG+=Math.max(0,(H-bot-34)-yP)/2;
  const s=(H/2-yG)/p2;return{c:lerpLL(g,a,s/Lm),z,rot}}
function mapFitUnmapped(x,z0){const c=presetFor(x.c.id)&&!isAligned(x.c.id)?[x.c.lat,x.c.lng]:(GPS.pos&&meters(GPS.pos,[x.c.lat,x.c.lng])<2500?GPS.pos.slice():[x.c.lat,x.c.lng]);

  const id=++MAP.animId,t0=performance.now(),dr=((v.rot-from.rot+540)%360)-180,dist=meters(from.c,v.c),bump=Math.min(1.3,Math.log2(1+dist/220));

function mapDraw(){

  const hm=holeModel(x,true),W=MAP.W,H=MAP.H,pxm=1/mpp(),f=n=>n.toFixed(1);
  MAP.svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const on=p=>{const s=toScreen(p);return s[0]>-150&&s[0]<W+150&&s[1]>-150&&s[1]<H+150};
  let o='';
  hm.water.forEach(w=>{o+=`<polygon points="${pts(w.poly)}" fill="rgba(80,150,255,.18)" stroke="#a8ccff" stroke-width="1.2"/>`});
  hm.bunkers.forEach(b=>{if(b.poly){if(on(centroid(b.poly)))o+=`<polygon points="${pts(b.poly)}" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.3"/>`}
    else if(on(b.p)){const s=toScreen(b.p);o+=`<circle cx="${f(s[0])}" cy="${f(s[1])}" r="${f(Math.max(5,b.r*pxm+2))}" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.3"/>`}});
  if(!hm.green){MAP.svg.innerHTML=o;MAP.bub.innerHTML='';return}
  const pp=MAP.mode?null:player(x,hm),tg=pp?target(x,hm,pp):null,gs=toScreen(hm.green),gR=Math.max(11,hm.gr*pxm);

    o+=`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="5.5" fill="${TEE_COL[k]||'#cfd8d3'}" stroke="${k==='white'?'#333':'#fff'}" stroke-width="1.8"/>`});
  o+=`<circle cx="${f(gs[0])}" cy="${f(gs[1])}" r="${f(gR)}" fill="rgba(255,255,255,.2)"/><circle cx="${f(gs[0])}" cy="${f(gs[1])}" r="5.5" fill="#fff"/>`;
  let bub='';

    if(GPS.pos&&pp.src!=='gps'&&gpsOnCourse(hm)){const s=toScreen(GPS.pos);o+=`<circle cx="${f(s[0])}" cy="${f(s[1])}" r="7" fill="#3d8bff" stroke="#fff" stroke-width="2.5" opacity=".9"/>`}

/* bubbles: big pill (distance + plays like) and small dark circles */
const PW=158,PH=56,CR=29;

  let l=m1[0]-30-PW,left=true;if(l<2){if(m1[0]-PW-6>=2)l=2;else{left=false;l=m1[0]+30}}l=clamp(l,2,W-PW-2);
  const y1=clamp(m1[1],B.y0,B.y1);
  let cx=left?m2[0]+64:m2[0]-64;cx=clamp(cx,CR+8,W-CR-8);let cy=clamp(m2[1],B.y0,B.y1);
  if(Math.abs(cy-y1)<PH+8&&Math.abs(cx-(l+PW/2))<PW/2+CR+8)cy=y1-(PH+14);
  return pillHtml(d1,pl,'',l,y1)+circHtml(d2,'',cx,cy)}
function greenBubbles(x,hm,pp,ps,gs,fb){

    let by=Math.min(bs[1],gs[1]-40),fy=Math.max(fs[1],gs[1]+40);by=clamp(by,B.y0-20,B.y1);fy=clamp(fy,B.y0,B.y1+20);if(fy-by<2*CR+8)fy=by+2*CR+8;
    h+=circHtml(fb.b,'Back',cx,by)+circHtml(fb.f,'Front',cx,fy)}

const LIE_S={on:false,b:0,g:0,n:0};
function onTilt(e){if(e.beta==null)return;LIE_S.b=LIE_S.b*.8+e.beta*.2;LIE_S.g=LIE_S.g*.8+e.gamma*.2;LIE_S.n++;drawLie()}
async function startLie(){
  try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw 'denied'}
    window.addEventListener('deviceorientation',onTilt);LIE_S.on=true;LIE_S.n=0;setTimeout(()=>{if(!LIE_S.n){const e=document.getElementById('lieOut');if(e)e.innerHTML='<p class="note" style="color:var(--red)">No tilt sensor reading. This needs your phone (not a computer) and the app opened directly in Safari/Chrome.</p>'}},2500)}
  catch(e){const o=document.getElementById('lieOut');if(o)o.innerHTML='<p class="note" style="color:var(--red)">Motion access was blocked. On iPhone allow Motion &amp; Orientation access when asked.</p>'}}
function stopLie(){window.removeEventListener('deviceorientation',onTilt);LIE_S.on=false}
function lieRead(b,g){const lh=S.set.hand==='L';const up=b,side=lh?-g:g; // side<0 => ball above feet (RH)
  const res=[];
  if(up>2)res.push(['Uphill lie',`${up.toFixed(0)}°`,'Ball flies higher and shorter — take about one more club, shoulders with the slope, expect a pull.']);
  else if(up<-2)res.push(['Downhill lie',`${(-up).toFixed(0)}°`,'Lower flight with more run — take about one less club, ball back in stance, swing down the slope.']);
  if(side<-2)res.push(['Ball above feet',`${(-side).toFixed(0)}°`,`Ball tends to go ${lh?'right':'left'} — aim ${lh?'left':'right'} and grip down.`]);
  else if(side>2)res.push(['Ball below feet',`${side.toFixed(0)}°`,`Ball tends to go ${lh?'left':'right'} — aim ${lh?'right':'left'}, flex knees, stay down.`]);
  if(!res.length)res.push(['Flat lie','<2°','Stock swing — no slope adjustment needed.']);return res}
function drawLie(){const o=document.getElementById('lieOut');if(!o)return;const r=lieRead(LIE_S.b,LIE_S.g);
  const bx=-Math.max(-30,Math.min(30,LIE_S.g))*1.6,by=Math.max(-30,Math.min(30,-LIE_S.b))*1.6;
  o.innerHTML=`<div class="row" style="gap:16px;align-items:center"><svg width="110" height="110" viewBox="-55 -55 110 110"><circle r="52" fill="#fff" stroke="rgba(15,31,25,.1)"/><circle r="12" fill="none" stroke="#1d6b4a" stroke-dasharray="3 3"/><line x1="-52" x2="52" stroke="rgba(15,31,25,.08)"/><line y1="-52" y2="52" stroke="rgba(15,31,25,.08)"/><text y="-40" text-anchor="middle" font-size="9" fill="#7b8a84">TARGET</text><circle cx="${bx}" cy="${by}" r="9" fill="#1d6b4a"/></svg>
   <div style="flex:1">${r.map(([t,v,a])=>`<div style="margin-bottom:8px"><b>${t}</b> <span class="chip">${v}</span><div class="note">${a}</div></div>`).join('')}</div></div>`}
function lieSheet(){
  openSheet(`<div class="eyebrow">Lie check</div><h1 class="serif" style="font-size:30px">Am I on a slope?</h1>
   <p class="note">Lay your phone flat on the ground next to the ball with the <b>top pointing at your target</b>. It reads uphill / downhill and ball above / below your feet.</p>
   <div class="seg" style="margin:10px 0"><button class="${S.set.hand!=='L'?'on':''}" data-hand="R">Right-handed</button><button class="${S.set.hand==='L'?'on':''}" data-hand="L">Left-handed</button></div>

const short=c=>c.replace(' Iron','i').replace(' Wood','W').replace(' Hybrid','H').replace('Driver','DR').replace('Putter','PT');
function autoGross(H){const n=H.shots.filter(s=>s.club!=='Putter').length;return n?n+H.p+H.pen:0}
const chev=d=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="${d<0?'M15 5l-7 7 7 7':'M9 5l7 7-7 7'}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const check=()=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="#1d6b4a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const plus=()=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`;

/* hole schematic */
function seed(n){let s=n*9301+49297;return()=>((s=(s*9301+49297)%233280)/233280)}
function holeSvg(){
  const x=ctx(),W=360,Hh=440,top=58,bot=Hh-40,len=x.len;
  const rnd=seed(x.i+1+x.c.id.length*7);const bend=x.par>3?(rnd()-.5)*90:0;
  const P=t=>{const y=bot-(bot-top)*t;const xx=W/2+bend*Math.sin(Math.PI*t)*(t<.5?t*2:1);return[xx,y]};
  const pts=[];for(let k=0;k<=24;k++)pts.push(P(k/24));
  const path='M'+pts.map(p=>p.map(v=>v.toFixed(1)).join(' ')).join(' L');
  const fwW=x.par>3?54:30;
  const yt=y=>Math.min(1,Math.max(0,y/len));
  let s=`<svg viewBox="0 0 ${W} ${Hh}"><defs>
   <linearGradient id="rough" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe7d8"/><stop offset="1" stop-color="#e3f1e8"/></linearGradient>
   <radialGradient id="grn" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#7fd0a3"/><stop offset="1" stop-color="#4fb07f"/></radialGradient></defs>
   <rect width="${W}" height="${Hh}" fill="url(#rough)"/>
   <path d="${path}" stroke="#a8d8bb" stroke-width="${fwW+26}" stroke-linecap="round" fill="none" opacity=".55"/>
   <path d="${path}" stroke="#93cfac" stroke-width="${fwW}" stroke-linecap="round" fill="none"/>
   <path d="${path}" stroke="#86c8a2" stroke-width="${fwW}" stroke-dasharray="14 14" stroke-linecap="butt" fill="none" opacity=".35"/>`;
  // bunkers (decorative but consistent)
  if(x.par>3){const b1=P(.62+rnd()*.1);s+=`<ellipse cx="${b1[0]+(rnd()>.5?1:-1)*(fwW/2+14)}" cy="${b1[1]}" rx="16" ry="9" fill="#f3e6c4" stroke="#e6d3a2"/>`}
  const g=P(1);s+=`<ellipse cx="${g[0]-26}" cy="${g[1]+18}" rx="12" ry="7" fill="#f3e6c4" stroke="#e6d3a2"/><ellipse cx="${g[0]+28}" cy="${g[1]-4}" rx="10" ry="7" fill="#f3e6c4" stroke="#e6d3a2"/>`;
  s+=`<ellipse cx="${g[0]}" cy="${g[1]}" rx="34" ry="24" fill="url(#grn)" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
   <path d="M${g[0]+3} ${g[1]+2}V${g[1]-30}" stroke="#123" stroke-width="1.6"/><path d="M${g[0]+3} ${g[1]-30}l13 4.5-13 4.5z" fill="#c8553d"/>`;
  // yardage arcs from green
  [100,150,200,250].forEach(m=>{if(m>=len-10)return;const p=P(yt(len-m));
    s+=`<line x1="${p[0]-fwW/2-6}" x2="${p[0]+fwW/2+6}" y1="${p[1]}" y2="${p[1]}" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 4" opacity=".9"/>
    <text x="${p[0]+fwW/2+12}" y="${p[1]+4}" font-size="11" font-weight="700" fill="#2c4a3d">${S.set.units==='m'?Math.round(m/Y):m}</text>`});
  // tee
  const t0=P(0);s+=`<rect x="${t0[0]-16}" y="${t0[1]-6}" width="32" height="12" rx="4" fill="#9fd6b5" stroke="#fff"/>`;
  // shots trail
  const H=x.H;const sp=H.shots.map((sh,k)=>{const a=Math.max(0,len-(sh.rem??len));const p=P(yt(a));const off=sh.lie==='rl'?-fwW/2-8:sh.lie==='rr'?fwW/2+8:0;return[p[0]+off,p[1]]});
  if(sp.length){const cur=P(yt(along()));const all=GPS.pos||GPS.sim?[...sp,cur]:sp;
    s+=`<path d="M${all.map(p=>p.join(' ')).join(' L')}" stroke="#fff" stroke-width="2" fill="none" stroke-dasharray="1 5" stroke-linecap="round"/>`;
    sp.forEach((p,k)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="#0f1f19"/><text x="${p[0]}" y="${p[1]+3.6}" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">${k+1}</text>`})}
  if(GPS.pos||GPS.sim){const me=P(yt(along()));s+=`<g id="me"><circle cx="${me[0]}" cy="${me[1]}" r="16" fill="#3d6fc8" opacity=".18"/><circle cx="${me[0]}" cy="${me[1]}" r="7" fill="#3d6fc8" stroke="#fff" stroke-width="2.5"/></g>`}
  s+=`<text x="14" y="${Hh-14}" font-size="10.5" fill="#5d7268" font-weight="600">Schematic · not to scale laterally</text></svg>`;
  return s;
}

/* scorecard */
function cardView(){
  const r=R()||lastRound();let h=header();
  if(!r)return h+`<h1 class="serif">Scorecard</h1><div class="glass empty">Start a round to fill in your card.</div>`;
  const c=course(r.cid),t=teeOf(c,r.tee),ch=courseHcp(t),n=t.h.length;
  h+=`<div class="eyebrow">${new Date(r.date).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})} · ${t.n} tees</div><h1 class="serif">${c.name}</h1>
  <p class="sub">Course handicap <b>${ch}</b> from index ${S.set.hcp}${t.r?` · CR ${t.r} / Slope ${t.s}`:''}</p>`;
  const halves=n===18?[[0,9,'Out'],[9,18,'In']]:[[0,n,'Tot']];
  let G=0,P=0,PT=0,SF=0,PU=0;
  halves.forEach(([a,b,lab])=>{
    let rows='',g=0,p=0,y=0,sf=0,pu=0;
    for(let i=a;i<b;i++){const [par,si,yy]=t.h[i],H=r.holes[i],gr=H.g||autoGross(H),rec=strokesRec(si,ch,n),pts=stableford(gr,par,rec);
      p+=par;y+=yy;if(gr){g+=gr;sf+=pts;pu+=H.p}
      rows+=`<tr class="${R()&&r.cur===i?'cur':''}" data-a="goto" data-i="${i}"><td><b>${i+1}</b></td><td>${fmt(yy)}</td><td>${par}</td><td>${si||'–'}</td><td>${mark(gr,par)}</td><td>${gr?H.p:''}</td><td>${gr?pts:''}</td></tr>`}
    G+=g;P+=p;SF+=sf;PU+=pu;
    h+=`<div class="card glass" style="padding:10px 8px"><table class="sc"><tr><th>Hole</th><th>${U()==='y'?'Yds':'M'}</th><th>Par</th><th>SI</th><th>Score</th><th>Putts</th><th>Pts</th></tr>${rows}
     <tr class="tot"><td>${lab}</td><td>${fmt(y)}</td><td>${p}</td><td></td><td>${g||''}</td><td>${g?pu:''}</td><td>${g?sf:''}</td></tr></table></div>`});
  const played=r.holes.filter(H=>H.g||autoGross(H)).length;
  let parPlayed=0;r.holes.forEach((H,i)=>{if(H.g||autoGross(H))parPlayed+=t.h[i][0]});
  h+=`<div class="kpis"><div class="kpi glass"><div class="v">${G||'–'}</div><div class="l">Gross</div></div>
   <div class="kpi glass"><div class="v">${played?(G-parPlayed===0?'E':(G-parPlayed>0?'+':'')+(G-parPlayed)):'–'}</div><div class="l">To par</div></div>
   <div class="kpi glass"><div class="v">${played?SF:'–'}</div><div class="l">Stableford</div></div></div>`;
  h+=`<div class="note" style="text-align:center">Tap a hole to jump to it. Circle = birdie, double circle = eagle, square = bogey.</div>`;
  if(R())h+=`<div class="row" style="gap:10px;margin-top:12px"><button class="btn sec full" data-a="tab" data-v="play">Back to hole ${R().cur+1}</button><button class="btn pri full" data-a="end">Finish &amp; save</button></div>`;
  return h;
}
function mark(g,par){if(!g)return'';const d=g-par;const cl=d<=-2?'ea':d===-1?'bi':d===1?'bo':d>=2?'db':'';return `<span class="mk ${cl}">${g}</span>`}
function lastRound(){return S.rounds[S.rounds.length-1]}

/* stats */
function clubAvg(){
  const m={};S.rounds.concat(S.active?[S.active]:[]).forEach(r=>r.holes.forEach(H=>H.shots.forEach((s,k)=>{
    if(s.club==='Putter')return;const d=shotDist(H,k);if(d==null||d<15||d>400)return;
    if(s.lie==='rec')return;(m[s.club]=m[s.club]||[]).push(d)})));
  const o={};for(const k in m){const a=m[k].sort((x,y)=>x-y);const avg=a.reduce((x,y)=>x+y,0)/a.length;
    o[k]={avg,max:a[a.length-1],n:a.length,lo:a[Math.floor(a.length*.2)],hi:a[Math.ceil(a.length*.8)-1]}}return o}
function roundStats(r){const c=course(r.cid),t=teeOf(c,r.tee);let g=0,p=0,pu=0,fir=0,firN=0,gir=0,n=0;const bypar={3:[],4:[],5:[]};
  r.holes.forEach((H,i)=>{const gr=H.g||autoGross(H);if(!gr)return;const par=t.h[i][0];n++;g+=gr;p+=par;pu+=H.p;(bypar[par]||[]).push(gr-par);
    if(par>3&&H.fir){firN++;if(H.fir==='Hit')fir++}if(gr-H.p<=par-2)gir++});
  return{g,p,pu,fir,firN,gir,n,bypar,c,t}}
function stats(){
  let h=header()+`<div class="eyebrow">Performance</div><h1 class="serif">Your game</h1>`;
  const rs=S.rounds.filter(r=>roundStats(r).n>0);
  const all=rs.map(roundStats);const N=all.reduce((a,s)=>a+s.n,0);
  if(!rs.length)h+=`<p class="sub">Finish a round to unlock scoring trends. Club distances below build as you mark shots.</p>`;
  else{
    const toPar=all.reduce((a,s)=>a+(s.g-s.p),0)/N*18,pu=all.reduce((a,s)=>a+s.pu,0)/N*18;
    const firN=all.reduce((a,s)=>a+s.firN,0),fir=all.reduce((a,s)=>a+s.fir,0),gir=all.reduce((a,s)=>a+s.gir,0);
    h+=`<p class="sub">${rs.length} round${rs.length>1?'s':''} · ${N} holes tracked</p>
    <div class="kpis"><div class="kpi glass"><div class="v">${toPar>0?'+':''}${toPar.toFixed(1)}</div><div class="l">Avg / 18</div></div>
     <div class="kpi glass"><div class="v">${pu.toFixed(1)}</div><div class="l">Putts / 18</div></div>
     <div class="kpi glass"><div class="v">${Math.round(gir/N*100)}%</div><div class="l">GIR</div></div></div>`;
    h+=`<div class="card glass"><div class="eyebrow" style="margin-bottom:10px">Accuracy</div>
      ${statBar('Fairways hit',firN?fir/firN:0,firN?`${fir}/${firN}`:'–')}${statBar('Greens in regulation',gir/N,`${gir}/${N}`)}
      ${[3,4,5].map(p=>{const a=all.flatMap(s=>s.bypar[p]);if(!a.length)return'';const v=a.reduce((x,y)=>x+y,0)/a.length;return statBar('Par '+p+' average',Math.max(0,1-v/3),(p+v).toFixed(2))}).join('')}</div>`;
    h+=`<div class="card glass"><div class="eyebrow" style="margin-bottom:8px">Recent rounds</div>${trend(rs)}
     ${rs.slice(-6).reverse().map(r=>{const s=roundStats(r);return `<div class="clubrow" style="grid-template-columns:1fr auto auto"><div><b>${s.c.name}</b><div class="note">${new Date(r.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})} · ${s.n} holes</div></div><div class="n">${s.g}<small>${s.g-s.p>0?'+':''}${s.g-s.p}</small></div><button class="x" data-a="delround" data-id="${r.id}">✕</button></div>`}).join('')}</div>`;
  }
  const ca=clubAvg();const max=Math.max(260,...S.bag.map(b=>b.y));
  h+=`<div class="card glass"><div class="row" style="margin-bottom:6px"><div class="eyebrow">Club distances</div><span class="sp"></span><span class="note">tracked · stock</span></div>
   ${S.bag.filter(b=>b.y>0).map(b=>{const a=ca[b.c];return `<div class="clubrow"><b>${b.c}</b><div style="position:relative">
     <div class="bar"><i style="width:${(a?a.avg:b.y)/max*100}%;${a?'':'opacity:.35'}"></i></div>
     ${a?`<div style="position:absolute;top:-2px;height:12px;border-radius:6px;border:1.5px solid #1d6b4a;left:${a.lo/max*100}%;width:${Math.max(2,(a.hi-a.lo)/max*100)}%"></div>`:''}</div>
     <div class="n">${a?fmt(a.avg):fmt(b.y)}<small>${a?a.n+' shots · max '+fmt(a.max):'stock'}</small></div></div>`}).join('')}
   <div class="note" style="margin-top:8px">Bars show your average; the outline marks your typical 20–80% range.</div></div>`;
  return h;
}
function statBar(l,v,t){return `<div style="margin:10px 0"><div class="row" style="font-size:13px;margin-bottom:6px"><span>${l}</span><span class="sp"></span><b>${t}</b></div><div class="bar"><i style="width:${Math.round(Math.min(1,v)*100)}%"></i></div></div>`}
function trend(rs){const a=rs.slice(-10).map(r=>{const s=roundStats(r);return (s.g-s.p)/s.n*18});if(a.length<2)return'';
  const W=320,H=90,mn=Math.min(...a)-2,mx=Math.max(...a)+2;const pts=a.map((v,i)=>[10+i*(W-20)/(a.length-1),10+(v-mn)/(mx-mn)*(H-20)]);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-bottom:6px"><path d="M${pts.map(p=>p.join(' ')).join(' L')}" fill="none" stroke="#1d6b4a" stroke-width="2.5" stroke-linejoin="round"/>
   ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="#1d6b4a" stroke-width="2"/><text x="${p[0]}" y="${p[1]-8}" text-anchor="middle" font-size="10" font-weight="700" fill="#41524b">${a[i]>0?'+':''}${a[i].toFixed(0)}</text>`).join('')}</svg>`}

/* ---------- sheets ---------- */
let sheetClose=null;
function openSheet(html,onClose){if(sheetClose&&sheetClose!==onClose){const f=sheetClose;sheetClose=null;f()}sheetClose=onClose||null;$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#sheet').classList.add('on');$('#scrim').classList.add('on')}

$('#scrim').onclick=closeSheet;

function teeSheet(cid){const c=course(cid);let sel=defaultTee(c);
  const draw=()=>{openSheet(`<div class="eyebrow">${c.town}</div><h1 class="serif" style="font-size:30px">${c.name}</h1>
   <div class="h3">Which tee box are you playing from?</div><div class="grid3">${c.tees.map((t,i)=>`<button class="opt ${i===sel?'on':''}" data-t="${i}"><i class="dot" style="background:${TEE_COL[TEEK(t.n)]||'#ddd'};margin-right:6px"></i>${t.n}<small>${ydsTot(t).toLocaleString()} yds · par ${parTot(t)}</small></button>`).join('')}</div>
   <div class="h3">Holes</div><div style="display:grid;grid-template-columns:repeat(${Math.min(9,c.tees[sel].h.length)},1fr);gap:4px;font-size:11px;text-align:center">
   ${c.tees[sel].h.map((h,i)=>`<div style="background:#fff;border-radius:8px;padding:5px 0;border:1px solid var(--line)"><b>${i+1}</b><div style="color:var(--ink3)">P${h[0]}</div><div>${h[2]}</div></div>`).join('')}</div>
   <p class="note" style="margin-top:12px">${c.tees[sel].r?`Course rating ${c.tees[sel].r} · Slope ${c.tees[sel].s} · your course handicap ${courseHcp(c.tees[sel])}`:'No official rating published for these tees.'} · <a href="${c.url}" target="_blank" rel="noopener">Course data</a></p>
   <button class="btn pri full" style="margin-top:8px" id="go">Tee off</button>`);
   document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sel=+b.dataset.t;draw()});

let replaceArmed=0;
function confirmReplace(){if(Date.now()-replaceArmed<4000){archive();return true}replaceArmed=Date.now();toast('Round in progress — tap again to finish it and start new');return false}

function shotSheet(){
  const x=ctx(),d=distances();const rec=recommend(d.c);
  let club=rec?rec.club:'Putter';const H=x.H;
  let lie=H.shots.length===0?'tee':(d.c<30?'fr':'fw');if(x.par===3&&!H.shots.length)lie='tee';
  if(!H.shots.length&&x.par>3)club='Driver';
  const draw=()=>{openSheet(`<div class="row"><div><div class="eyebrow">Shot ${H.shots.length+1} · hole ${x.i+1}</div><h1 class="serif" style="font-size:30px;margin:2px 0 0">${fmt(d.c)}${U()} to the pin</h1></div></div>
    <div class="h3">Club</div><div class="grid4">${S.bag.map(b=>`<button class="opt ${b.c===club?'on':''}" data-c="${b.c}">${short(b.c)}<small>${b.y?fmt(b.y):'—'}</small></button>`).join('')}</div>
    <div class="h3">Hitting from</div><div class="grid4">${LIES.map(([k,v])=>`<button class="opt ${k===lie?'on':''}" data-l="${k}">${v}</button>`).join('')}</div>
    <button class="btn pri full" style="margin-top:16px" id="save">Save shot here</button>
    <p class="note" style="text-align:center">Position is locked from ${(player()||{}).src==='test'?'the ball you placed on the map':(player()||{}).src==='gps'?'GPS (±'+Math.round(GPS.acc)+'m)':'the tee box'}.</p>`);
    document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{club=b.dataset.c;draw()});
    document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lie=b.dataset.l;draw()});
    $('#save').onclick=()=>{
      if(club==='Putter'){H.p++;}
      else{const s={club,lie,rem:Math.round(d.c),t:Date.now()};const cp=curPos();if(cp)s.pos=cp.slice();H.shots.push(s);
        if(H.shots.length===1&&s.pos&&!S.teesPos[gk(x.c,x.i)]&&lie==='tee')S.teesPos[gk(x.c,x.i)]=s.pos.slice();
        if(H.shots.length===2&&x.par>3&&!H.fir)H.fir=lie==='fw'?'Hit':lie==='rl'?'L':lie==='rr'?'R':null;}
      H.man=false;H.g=0;save();closeSheet();render();toast(club==='Putter'?'Putt added':'Shot '+H.shots.length+' saved')};
  };draw()}

function greenSheet(){
  const x=ctx();const k=gk(x.c,x.i);const g=S.greens[k]||{};
  const can=!!curPos();
  openSheet(`<div class="eyebrow">Hole ${x.i+1} · map the green</div><h1 class="serif" style="font-size:30px">Lock in this green</h1>
   <p class="note">Stand on the spot and tap. Centre is all you need — front and back sharpen the numbers. Saved on this device for every future round.</p>
   <div class="grid3" style="margin-top:12px">
    <button class="opt ${g.f?'on':''}" data-gp="f" ${can?'':'disabled'}>Front<small>${g.f?'saved':'tap here'}</small></button>
    <button class="opt ${g.c?'on':''}" data-gp="c" ${can?'':'disabled'}>Centre<small>${g.c?'saved':'tap here'}</small></button>
    <button class="opt ${g.b?'on':''}" data-gp="b" ${can?'':'disabled'}>Back<small>${g.b?'saved':'tap here'}</small></button></div>
   ${can?'':'<p class="note" style="color:var(--red)">Needs a GPS fix or a spot tapped on the map.</p>'}
   ${x.H.shots.length?`<div class="h3">Last shot finished</div><div class="grid3">${[['gr','On green'],['fr','Fringe'],['bk','Bunker']].map(([k2,v])=>`<button class="opt" data-end="${k2}">${v}</button>`).join('')}</div>`:''}
   ${g.c?'<button class="btn sec full" style="margin-top:14px" data-gp="clear">Clear saved green</button>':''}`);
  document.querySelectorAll('[data-gp]').forEach(b=>b.onclick=()=>{const w=b.dataset.gp;
    if(w==='clear'){delete S.greens[k]}else{const cp=curPos();if(!cp)return;S.greens[k]=Object.assign({},S.greens[k]||{});S.greens[k][w]=cp.slice();if(!S.greens[k].c)S.greens[k].c=cp.slice()}
    save();greenSheet();renderLive();toast(w==='clear'?'Green cleared':'Green '+(w==='c'?'centre':w==='f'?'front':'back')+' saved')});
  document.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>{const last=x.H.shots[x.H.shots.length-1];
    const d=distances();last.end=Math.max(0,Math.round((last.rem||x.len)-d.c));last.fin=b.dataset.end;save();closeSheet();render();toast('Shot '+x.H.shots.length+': '+fmt(last.end)+U())});
}

/* ---------- actions ---------- */
function archive(){if(!S.active)return;const r=S.active;if(roundStats(r).n>0)S.rounds.push(r);S.active=null;save()}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;const x=ctx();
  switch(a){
    case'pick':teeSheet(b.dataset.id);break;
    case'resume':startGPS();setView('play');onHole();break;
    case'gps':openSheet(`<div class="eyebrow">Location</div><h1 class="serif" style="font-size:30px">GPS</h1>
       <p class="note">${GPS.err?`<b>${GPS.err}.</b> `:''}Live distances use your phone's GPS. The Claude app blocks location — open Fairway from its own web link in Safari or Chrome and allow access.</p>
       <div class="grid3" style="margin-top:12px;grid-template-columns:1fr 1fr"><button class="opt" id="gOn">Use GPS</button><button class="opt" id="gOff">Off</button></div>`);
       $('#gOn').onclick=()=>{GPS.sim=false;watchId=null;closeSheet();startGPS()};
       $('#gOff').onclick=()=>{GPS.sim=false;if(watchId!==null)try{navigator.geolocation.clearWatch(watchId)}catch(e){};watchId=null;GPS.pos=null;GPS.state='idle';closeSheet();render()};break;
    case'prev':if(x&&x.i>0){x.r.cur--;save();render();onHole()}break;
    case'next':if(!x)break;if(x.i<x.t.h.length-1){x.r.cur++;save();render();onHole()}else{setView('card')}break;
    case'goto':if(R()){closeSheet();R().cur=+b.dataset.i;save();setView('play');onHole()}break;
    case'shot':shotSheet();break;
    case'green':greenSheet();break;
    case'lie':lieSheet();break;
    case'chgtee':if(x){openSheet(`<div class="eyebrow">${x.c.name}</div><h1 class="serif" style="font-size:28px">Change tee box</h1><div class="grid3" style="margin-top:12px">${x.c.tees.map((t,i)=>`<button class="opt ${i===x.r.tee?'on':''}" data-nt="${i}"><i class="dot" style="background:${TEE_COL[TEEK(t.n)]||'#ddd'};margin-right:6px"></i>${t.n}<small>${t.h[x.i][2]} yds</small></button>`).join('')}</div>`);
      document.querySelectorAll('[data-nt]').forEach(bb=>bb.onclick=()=>{x.r.tee=+bb.dataset.nt;S.set.tee[x.c.id]=x.r.tee;MAP.touched=false;save();closeSheet();render()})}break;
    case'holes':holesSheet();break;
    case'score':scoreSheet();break;
    case'plays':playsSheet();break;
    case'wx':wxSheet();break;
    case'finish':setView('card');toast('Check your card, then tap Finish & save');break;
    case'mzoom':MAP.zoomG=!MAP.zoomG;mapFit(true);hudRender();break;
    case'mgps':if(x){delete PL.spoof[gk(x.c,x.i)];if(watchId===null&&GPS.state!=='bad')startGPS();MAP.zoomG=false;mapFit(true);hudRender()}break;
    case'livegps':if(x){delete PL.spoof[gk(x.c,x.i)];MAP.touched=false;mapFit(true);hudRender()}break;
    case'mzin':case'mzout':if(MAP.view){zoomAt(a==='mzin'?.8:-.8,MAP.W/2,MAP.H/2)}break;
    case'mfit':MAP.touched=false;mapFit();break;
    case'mtools':toolsSheet();break;
    case'mapthis':if(x)modeStart(isAligned(x.c.id)?'map':'align');break;
    case'modecancel':modeCancel();break;
    case'modegps':if(MAP.mode&&GPS.pos)modeTap(GPS.pos.slice());else toast('No GPS fix yet — tap the map instead');break;
    case'remap':modeStart('map');break;
    case'realign':modeStart('align');break;
    case'resetmap':if(x){const k=gk(x.c,x.i);delete S.greens[k];delete S.tb[k];delete S.teesPos[k];save();closeSheet();MAP.touched=false;MAP.sig='';render();toast('Hole '+(x.i+1)+' back to the course data')}break;
    case'g+':case'g-':{const H=x.H;const cur=H.g||autoGross(H);H.g=cur?Math.max(1,cur+(a==='g+'?1:-1)):x.par;H.man=true;save();render();break}
    case'p+':x.H.p++;if(!x.H.man)x.H.g=0;save();render();break;
    case'p-':x.H.p=Math.max(0,x.H.p-1);save();render();break;
    case'pen+':x.H.pen++;save();render();break;
    case'pen-':x.H.pen=Math.max(0,x.H.pen-1);save();render();break;
    case'fir':x.H.fir=x.H.fir===b.dataset.v?null:b.dataset.v;save();render();break;
    case'delshot':x.H.shots.splice(+b.dataset.k,1);save();render();break;
    case'card':setView('card');break;
    case'end':if(Date.now()-(window._endA||0)<4000){closeSheet();archive();toast('Round saved');setView('stats')}else{window._endA=Date.now();toast('Tap Finish again to save the round')}break;
    case'delround':if(Date.now()-(window._delA||0)<4000){S.rounds=S.rounds.filter(r=>r.id!=b.dataset.id);save();render()}else{window._delA=Date.now();toast('Tap ✕ again to delete')}break;
    case'units':S.set.units=b.dataset.v;save();render();break;
    case'hand':S.set.hand=b.dataset.v;save();render();break;
    case'tab':setView(b.dataset.v);break;
    case'export':{const txt=JSON.stringify(S);try{navigator.clipboard.writeText(txt).then(()=>toast('Backup copied'),()=>showText(txt))}catch(err){showText(txt)}break}
    case'import':openSheet(`<h1 class="serif" style="font-size:28px">Restore backup</h1><textarea id="imp" style="width:100%;height:160px;border-radius:12px;border:1px solid var(--line);padding:10px;font:12px monospace"></textarea><button class="btn pri full" id="impGo" style="margin-top:10px">Restore</button>`);
      $('#impGo').onclick=()=>{try{const d=JSON.parse($('#imp').value);if(!d.bag)throw 0;S=Object.assign(load(),d);save();closeSheet();render();toast('Restored')}catch(err){toast('That backup could not be read')}};break;
  }
});
function showText(t){openSheet(`<h1 class="serif" style="font-size:28px">Your backup</h1><p class="note">Select all and copy.</p><textarea style="width:100%;height:160px;border-radius:12px;border:1px solid var(--line);padding:10px;font:11px monospace">${t.replace(/</g,'&lt;')}</textarea>`)}
document.addEventListener('change',e=>{
  if(e.target.id==='hcp'){S.set.hcp=Math.max(-10,Math.min(54,parseFloat(e.target.value)||0));save()}
  if(e.target.dataset.bag){const b=S.bag.find(z=>z.c===e.target.dataset.bag);b.y=Math.max(0,parseInt(e.target.value)||0);save()}
});

/* ---------- render ---------- */
const TABS=[['play','Play','M12 3v14M12 3l7 3-7 3M6 20c2-1.4 4-2 6-2s4 .6 6 2'],['card','Card','M5 4h14v16H5zM9 4v16M5 9h14M5 14h14'],['stats','Stats','M5 20V10M12 20V4M19 20v-7'],['bag','Bag','M8 8V5a4 4 0 018 0v3M5 8h14l-1 12H6z']];
function render(){
  const v=VIEW,fs=v==='play'&&!!R();const map={home,play:()=>R()?play():home(),card:cardView,stats,bag:bagView};
  document.body.classList.toggle('fs',fs);
  $('#app').innerHTML=(map[v]||home)();
  if(fs){HUD_LAST='';hudRender();fillMap()}
  $('#tabs').innerHTML=TABS.map(([k,l,p])=>`<button class="${(v===k||(v==='home'&&k==='play'))?'on':''}" data-a="tab" data-v="${k==='play'&&!R()?'home':k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${p}"/></svg>${l}</button>`).join('');
}
function renderLive(){
  if(VIEW!=='play'||!R()){const p=document.querySelector('.top .pill');if(p)p.outerHTML=header().match(/<button class="pill[\s\S]*?<\/button>/)[0];return}
  if(!document.getElementById('hud')){render();return}
  fillMap();hudRender();refreshElevSoon();
}
setInterval(()=>{if(VIEW==='play'&&R()){const c=ctx().c;const w=NET.wx[c.id];if(w&&w!=='loading'&&Date.now()-w.at>10*60e3)loadWx(c)}},60e3);
render();
loadWx(course('les-ormes'));
if(S.active){startGPS();onHole()}
</script>
</body>
</html>
